version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oceansphere_postgres
    environment:
      POSTGRES_DB: ocean_reliability_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nandith
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: oceansphere_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ocean_reliability_db
      - DB_USER=postgres
      - DB_PASSWORD=nandith
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    container_name: oceansphere_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
